<!DOCTYPE html>
<html>
    <head>
        <meta charset = "utf-8">
        <title>Bài số 7</title>
    </head> 
    <body>
        <h2>Bài 1: Vẽ các hình cơ bản</h2>
        <svg width="400" height="180">

        <!--HCN-->
        <rect x="80" y="50"
            width="170" height="80"
            fill="#4682b4"/>

        <!-- hinh tron -->
        <circle cx="165" cy="90"
            r="28"
            fill="#fd5436"/>

        <!-- duong cheo -->
        <line x1="80" y1="50"
            x2="250" y2="130"
            stroke="#ffff00"
            stroke-width="3"/>

        </svg>
        <h2>Bài 2: Vẽ ngôi nhà đơn giản</h2>
        <svg width="400" height="250">

        <!-- mai nha -->
        <!--(175,40): đỉnh mái; (90,110): góc trái; (265,110): góc phải-->
        <polygon
            points="175,40 90,110 265,110"
            fill="#5e1414"/>

        <!-- ngoi nha -->
        <rect
            x="105"
            y="110"
            width="150"
            height="120"
            fill="#8b4513"/>

        <!-- cua so -->
        <rect
            x="130"
            y="130"
            width="40"
            height="40"
            fill="#b2d2dd"
            stroke="#000000"/>

        <!-- cua -->
        <rect
            x="190"
            y="165"
            width="45"
            height="65"
            fill="#420f0f"/>
        </svg>
    </body>
</html>
