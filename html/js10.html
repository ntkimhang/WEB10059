<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Draw On Canvas</title>
</head>

<body onload="draw()">

    <canvas id="canvas" width="400" height="400"></canvas>

    <script>
        function draw() {
            var canvas = document.getElementById("canvas");
            var ctx = canvas.getContext("2d");

            // Rectangle
            ctx.fillStyle = "rgb(0,255,255)";
            ctx.fillRect(0, 0, 400, 400);

            // Fill circle
            ctx.beginPath();
            ctx.arc(
                200,              // tâm X
                200,              // tâm Y
                200,              // bán kính
                0,                // góc bắt đầu
                2 * Math.PI       // góc kết thúc
            );

            // Gradient
            var grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grd.addColorStop(0, "blue");
            grd.addColorStop(0.5, "white");
            grd.addColorStop(1, "blue");

            ctx.fillStyle = grd;
            ctx.fill();
            ctx.stroke();

            // Polygon hình thoi
            ctx.beginPath();
            ctx.moveTo(200, 0);
            ctx.lineTo(400, 200);
            ctx.lineTo(200, 400);
            ctx.lineTo(0, 200);
            ctx.lineTo(200, 0);

            ctx.fillStyle = "pink";
            ctx.fill();

            ctx.strokeStyle = "cyan";
            ctx.lineWidth = 3;
            ctx.stroke();

            // Text
            ctx.font = "80px Arial";
            ctx.lineWidth = 5;
            ctx.strokeStyle = "blue";

            ctx.strokeText(
                "HTML5",
                canvas.width / 5,
                canvas.height / 2 + 20
            );
        }
    </script>

</body>
</html>
