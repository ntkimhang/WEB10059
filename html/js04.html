<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mảng</title>
    <script>
      function taoMang() {
        var i;
        var n = parseInt(document.getElementById("sopt").value);
        arr = new Array(n); //mảng toàn cục

        for (i = 0; i < n; i++) {
          let x = Math.random();
          console.log(x);
          arr[i] = Math.floor(x * 1000) % 50;
        }
        document.getElementById("txtArr1").value = arr.join(" ");
      }

      function tang(a, b) {
        return a - b; //thu tu tang
      }

      function mangTang() {
        arr.sort(tang);
        document.getElementById("txtArr2").value = arr.join(" ");
      }

      function giam(a, b) {
        return b - a; //thu tu giam
      }

      function mangGiam() {
        arr.sort(giam);
        document.getElementById("txtArr3").value = arr.join(" ");
      }
    </script>
  </head>

  <body>
    <label for="sopt">Nhập sô phần tử</label>
    <input type="number" id="sopt" value="10" size="10" />
    <br />
    <button onClick="taoMang()">Tạo mảng</button>
    <button onClick="mangTang()">Sắp xếp mảng tăng dần</button>
    <button onClick="mangGiam()">Sắp xếp mảng giảm dần</button>

    <br />
    <label for="txtArr1">Mảng ban đầu: </label>
    <input type="text" id="txtArr1" size="50" />

    <br />
    <label for="txtArr2">Mảng tăng dần: </label>
    <input type="text" id="txtArr2" size="50" />

    <br />
    <label for="txtArr3">Mảng giảm dần: </label>
    <input type="text" id="txtArr3" size="50" />
  </body>
</html>
